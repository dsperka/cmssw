input{font:inherit;width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}

<script>
const D=JSON.parse(document.getElementById("d").textContent);

const label=v=>v.replace("ALREADY FIXED","Already fixed").replace("NOT APPLICABLE","Not applicable").replace(/^[A-Z]+$/,m=>m[0]+m.slice(1).toLowerCase());
$("sub").textContent="Cherry-picking the 94 review comments of PR 50766 onto the working branch, one validated batch at a time. Updated "+D.gen+".";

$("batches").innerHTML=D.b.map(b=>`<div class="row"><div class="t"><span class="n">${esc(b.n)}</span><span class="pill ${cls(b.v)}">${esc(label(b.v))}</span></div>${b.note?`<p>${esc(b.note)}</p>`:""}</div>`).join("");
$("conv").innerHTML=D.v.map(t=>`<div class="row"><div class="t"><span class="n">${esc(t.n)} <span class="loc">${esc(t.who)}</span></span><span class="pill ${cls(t.d)}">${esc(t.d.startsWith("PARTLY")?"Partly":label(t.d))}</span></div><p class="cm">${esc(t.c)}</p><p>${esc(t.note)}</p></div>`).join("");
let filt="ALL",q="";
const kinds=["ALL",...Array.from(new Set(D.t.map(t=>cls(t.d))))];
$("chips").innerHTML=kinds.map(k=>`<button data-k="${k}" aria-pressed="${k==="ALL"}">${k==="ALL"?"All":esc(label(k==="ALREADY"?"ALREADY FIXED":k==="NOT"?"NOT APPLICABLE":k))}</button>`).join("");
function draw(){
  $("threads").innerHTML=D.t.filter(t=>(filt==="ALL"||cls(t.d)===filt)&&(!q||(t.who+t.loc+t.c+t.note+t.b).toLowerCase().includes(q))).map(t=>
   `<div class="row"><div class="t"><span class="n">#${esc(t.n)} <span class="loc">${esc(t.who)} · ${esc(t.loc)}</span></span><span class="pill ${cls(t.d)}">${esc(label(t.d))}</span></div><p class="cm">${esc(t.c)}</p><p>${esc(t.note)}${t.b&&t.b!=="-"?` <em>(${esc(t.b)})</em>`:""}</p></div>`).join("")||"<p class=sub>No matching comments.</p>";
}
$("chips").onclick=e=>{const k=e.target.dataset.k;if(!k)return;filt=k;for(const b of $("chips").children)b.setAttribute("aria-pressed",b.dataset.k===k);draw()};
$("q").oninput=e=>{q=e.target.value.toLowerCase();draw()};
draw();
</script>
